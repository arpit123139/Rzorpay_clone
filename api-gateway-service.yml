server:
  port: 8080

app:
  security:
    public-routes:
      - "/v1/auth/**"
      - "/webhook/**"
      - "/actuator/**"
  rate-limit:
    method: fixed
    use-case:
      api-key:
        request-per-minute: 200

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/v1/auth/**, /v1/merchants/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/v1/orders/**, /v1/payments/**
            - id: vault-service
              uri: lb://vault-service
              predicates:
                - Path=/v1/vault/**
            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/webhook/**
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpay-merchant-db}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
