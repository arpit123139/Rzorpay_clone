server:
  port: 9030

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpay-operations-db}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  webhook:
    delivery:
      redis-key: "webhook-retry"
  merchant-context:
    filter-enabled: true
