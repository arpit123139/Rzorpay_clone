server:
  port: 9030

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpay-operations-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Akg@1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 3000
          vault-service:
            connectTimeout: 2000
            readTimeout: 5000

app:
  webhook:
    delivery:
      redis-key: "webhook-retry"
  merchant-context:
    filter-enabled: true

resilience4j:
  circuitbreaker:
    instances:
      merchant-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      payment-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3

  retry:
    instances:
      merchant-service:
        max-attempts: 3
        wait-duration: 500ms
      payment-service:
        max-attempts: 2
        wait-duration: 500ms
