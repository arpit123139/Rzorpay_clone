spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    hikari:
      maximum-pool-size: 50
  eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/
      enabled: true
      register-with-eureka: true
      fetch-registry: true
    instance:
      prefer-ip-address: true
      hostname: localhost

  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.request.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "om.example.distributed_razorpay.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

  threads:
    virtual:
      enabled: true

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        request-per-minute: 2
  kafka:
    topics:
      payment: payments.event
      order: orders.events
      refund: refund.events
      settlement: settlement.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

---
spring:
  config:
    activate:
      on-profile: k8s
  data:
    redis:
      host: redis.razorpay-core.svc.cluster.local
      port: 6379
  kafka:
    bootstrap-servers: kafka.razorpay-core.svc.cluster.local:9092
  cloud:
    discovery:
      enabled: false
  task:
    scheduling:
      pool:
        size: 4 #By default only 1 scheduler is allowed to run in a service

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  zipkin:
    tracing:
      endpoint: http://zipkin.razorpay-core.svc.cluster.local:9411/api/v2/spans

feign:
  httpclient:
    hc5:
      enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

MERCHANT_SERVICE_URI: http://merchant-service
PAYMENT_SERVICE_URI: http://payment-service
VAULT_SERVICE_URI: http://vault-service
OPERATIONS_SERVICE_URI: http://operations-service
